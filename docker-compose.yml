services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: laundry
      POSTGRES_PASSWORD: laundry_local_only
      POSTGRES_DB: laundry
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laundry -d laundry"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: laundry
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      MINIO_ROOT_PASSWORD: laundry_local_secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
  minio-init:
    image: minio/mc:RELEASE.2025-02-08T19-14-21Z
    depends_on: [minio]
    entrypoint: /bin/sh -c 'until mc alias set local http://minio:9000 laundry laundry_local_secret; do sleep 1; done; mc mb --ignore-existing local/laundry-private'
volumes:
  postgres_data:
  minio_data:
